version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pineo deliberado: lo gestiona el pipeline ort-bump (vendorea public/ort/).
      - dependency-name: onnxruntime-web
      # ponytail: un patch de vite-plus no mueve el vitest que embutea, pero un
      # minor/major sí (1.0.0→1.1.0 lo llevó de 5.0.1 a 5.0.3) y ese bump exige
      # mover overrides.vitest + package.json a la vez. dependabot no ve ese
      # acoplamiento, así que solo los minor/major quedan manuales.
      - dependency-name: vite-plus
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # ponytail: lockstep con el vitest que embutea vite-plus ("Keep coverage
      # providers at the bundled runner's exact version"). Un bump suelto del
      # provider rompe el guard de coverage de vp, así que solo va manual junto
      # al bump de vite-plus.
      - dependency-name: "@vitest/coverage-v8"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
