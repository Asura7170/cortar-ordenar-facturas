name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Evita dos deploys pisandose: el segundo espera al primero.
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pages rechaza archivos >25MB: el fastvit (79MB) se sirve de HuggingFace en prod.
      - run: mv public/models/fastvit_sa24_h_e_bifpn_256_fp32.onnx "$RUNNER_TEMP/"
      - run: pnpm build
      # El .wasm de ort en PROD sale del CDN (wasmPaths), no de dist/: nada de dist/ort/ se pide.
      - run: rm -rf dist/ort dist/assets/ort-*.wasm
      # Gate 25MB de Pages sobre todo dist/ (antes solo .onnx: el .wasm coló el fallo).
      - run: find dist -type f -size +25M -print | grep . && exit 1 || exit 0
      - run: pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4 pages deploy dist --project-name cortar-ordenar-facturas --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b6874c516d9bd57c8377b670aa3a3b80
