name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# ponytail: sin esto, cada push nuevo encola un run entero sin cancelar el
# anterior y acaban compitiendo por los runners. Con la cola llena, GitHub
# CANCELA el job a los 15min sin asignarle runner (steps=0, runner='') y el PR
# queda rojo con "Some checks haven't completed yet" sin que haya un fallo real.
# grupo por workflow+ref: ci y quality no se cancelan entre si.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run test:coverage
      - run: pnpm build
