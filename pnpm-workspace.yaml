allowBuilds:
  esbuild: true
  protobufjs: true # dep de onnxruntime-web (parseo del .onnx)
catalog:
  # ponytail: las dos entradas van en la MISMA versión a propósito. vite-plus
  # valida en runtime que el alias de vite coincida con su core, y `vp build`
  # falla duro si no ("Expected @voidzero-dev/vite-plus-core@X, but found Y").
  # dependabot solo bumpea la segunda, así que este bump es manual.
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
  # ponytail: pineado al vitest que EMBUPA vite-plus, no al último de npm.
  # vite-plus asserta que @vitest/coverage-v4 coincida con su runner y aborta
  # el arranque si no ("vite-plus bundles vitest@X, but @vitest/coverage-v8@Y is
  # installed"), así que subir esto sin subir vite-plus rompe `test:coverage`.
  # Subir los dos juntos, nunca este override en solitario.
  vitest: "5.0.1"
  # ponytail: parche de CVE (GHSA-68fv-2mgg-jv7q, event-loop DoS). Llega
  # transitivo por postcss<-vite-plus-core y jsdom<-vitest; ninguna de las dos
  # lo sube sola porque fijan ^1.2.1. 1.2.2 cabe en ese rango, asi que es un
  # override real y no un force. Quitarlo cuando postcss/jsdom suban el minimo.
  source-map-js: "1.2.2"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
